<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Talently</title>
    <link rel="stylesheet" th:href="@{/css/talently.css}" />
    <link rel="stylesheet" th:href="@{/css/portail.css}" />
  </head>
  <body class="pt-body">
    <div th:replace="~{fragments/portail :: entete}"></div>

    <main class="pt-auth">
      <div class="pt-auth-card">
        <h1 class="pt-auth-title">Connexion candidat</h1>
        <p class="pt-auth-sub">
          Connectez-vous pour postuler et suivre vos candidatures.
        </p>

        <div
          class="alert error"
          th:if="${erreur != null}"
          th:text="${erreur}"
          role="alert"
        ></div>

        <form
          class="pt-form"
          method="post"
          th:action="@{/candidate-portal/connexion}"
        >
          <input type="hidden" name="retour" th:value="${retour}" />

          <div>
            <label class="label" for="email">Email</label>
            <input
              id="email"
              name="email"
              class="field"
              type="email"
              maxlength="150"
              required
              autocomplete="email"
              th:value="${email}"
            />
          </div>

          <div>
            <label class="label" for="motDePasse">Mot de passe</label>
            <input
              id="motDePasse"
              name="motDePasse"
              class="field"
              type="password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="primary-button pt-block">
            Se connecter
          </button>
        </form>

        <p class="pt-auth-foot">
          Pas encore de compte ?
          <a th:href="@{/candidate-portal/inscription(retour=${retour})}"
            >Créer un compte</a
          >
        </p>
      </div>
    </main>
  </body>
</html>
