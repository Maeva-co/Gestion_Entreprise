<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un compte — Talently</title>
    <link rel="stylesheet" th:href="@{/css/talently.css}" />
    <link rel="stylesheet" th:href="@{/css/portail.css}" />
  </head>
  <body class="pt-body">
    <div th:replace="~{fragments/portail :: entete}"></div>

    <main class="pt-auth">
      <div class="pt-auth-card">
        <h1 class="pt-auth-title">Créer votre compte</h1>
        <p class="pt-auth-sub">
          Un compte candidat est nécessaire pour postuler. Il ne vous prendra
          qu'une minute.
        </p>

        <div
          class="alert error"
          th:if="${erreur != null}"
          th:text="${erreur}"
          role="alert"
        ></div>

        <form
          class="pt-form"
          method="post"
          th:action="@{/candidate-portal/inscription}"
        >
          <input type="hidden" name="retour" th:value="${retour}" />

          <div class="pt-row">
            <div>
              <label class="label" for="prenom"
                >Prénom <span class="required">*</span></label
              >
              <input
                id="prenom"
                name="prenom"
                class="field"
                type="text"
                maxlength="100"
                required
                autocomplete="given-name"
                th:value="${prenom}"
              />
            </div>
            <div>
              <label class="label" for="nom"
                >Nom <span class="required">*</span></label
              >
              <input
                id="nom"
                name="nom"
                class="field"
                type="text"
                maxlength="100"
                required
                autocomplete="family-name"
                th:value="${nom}"
              />
            </div>
          </div>

          <div>
            <label class="label" for="email"
              >Email <span class="required">*</span></label
            >
            <input
              id="email"
              name="email"
              class="field"
              type="email"
              maxlength="150"
              required
              autocomplete="email"
              th:value="${email}"
            />
          </div>

          <div>
            <label class="label" for="motDePasse"
              >Mot de passe <span class="required">*</span></label
            >
            <input
              id="motDePasse"
              name="motDePasse"
              class="field"
              type="password"
              minlength="8"
              required
              autocomplete="new-password"
            />
            <p class="pt-help">8 caractères minimum.</p>
          </div>

          <div>
            <label class="label" for="confirmation"
              >Confirmer le mot de passe <span class="required">*</span></label
            >
            <input
              id="confirmation"
              name="confirmation"
              class="field"
              type="password"
              minlength="8"
              required
              autocomplete="new-password"
            />
          </div>

          <button type="submit" class="primary-button pt-block">
            Créer mon compte et continuer
          </button>
        </form>

        <p class="pt-auth-foot">
          Déjà un compte ?
          <a th:href="@{/candidate-portal/connexion(retour=${retour})}"
            >Se connecter</a
          >
        </p>
      </div>
    </main>
  </body>
</html>
