spring.application.name=gestion-entreprise
server.port=8080

# --- Base de données PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_rh
spring.datasource.username=rh_user
spring.datasource.password=Rh2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Les tables sont créées par vos scripts SQL : Hibernate vérifie seulement le mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

